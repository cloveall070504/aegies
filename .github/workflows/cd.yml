name: CD (Deploy to Alibaba Cloud ECS)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH (git pull + build)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT }}
          script: |
            set -e
            cd ${{ secrets.ECS_DEPLOY_DIR }}

            # 确认远端指向 GitHub（仓库公开，HTTPS 匿名拉取无需凭据），然后拉最新代码
            git remote set-url origin https://github.com/cloveall070504/aegies.git 2>/dev/null || true
            git fetch origin
            git reset --hard origin/master
            git clean -fd -e '.env' -e 'backend/.env' -e 'frontend/.env' -e 'deploy.log'

            # 用默认 compose 文件（docker-compose.yml）重新构建并拉起，与你现有 deploy.sh 一致
            docker compose --env-file .env up -d --build --remove-orphans

            # 清理无引用镜像，避免磁盘被历史构建撑满
            docker image prune -f
