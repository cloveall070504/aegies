name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  backend:
    name: Backend (pytest + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run pytest with coverage
        # 覆盖率阈值（--cov-fail-under）为起步地板：本地 sandbox 的 coverage 工具会崩溃无法测量，
        # 首次 CI 运行后请按实际百分比上调（如 60/70）。低于该值则 CI 失败，防止覆盖率倒退。
        run: |
          python -m pytest tests/ -q --cov=app --cov-report=term-missing --cov-fail-under=50
        env:
          ENABLE_OLLAMA: "false"

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build
        run: |
          npm install
          npm run build

      - name: Run frontend tests
        run: npm test

  docker:
    name: Docker build (backend + frontend)
    runs-on: ubuntu-latest
    # 仅主分支推送时验证镜像可构建，避免 PR 频繁拉镜像
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend & frontend images
        run: docker compose build
