# 实战避错系统 —— 一键编排（后端 + 前端 + PostgreSQL）
# 用法：
#   docker compose up --build
#   - 前端：  http://localhost:8080  （nginx 反代 /api 到 backend:8000）
#   - 后端 API：http://localhost:8000/docs
#   - PostgreSQL：容器内 5432（账号见下方 environment）
#
# 所有敏感配置（数据库密码、JWT 密钥、大模型 Key）均通过 .env 文件注入，
# .env 已被 gitignore，不会进仓库。未提供时回退到下方默认值（仅供本地开发）。

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: avoid_error
      POSTGRES_USER: avoid_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-avoid_pass_change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avoid_user -d avoid_error"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # 存活探针：后端无响应时 Docker 会自动重启容器（崩溃自愈）。
    # 端口须与容器内 PORT（8000）一致；用 Python 标准库探测，避免镜像缺 curl。
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      DATABASE_URL: postgresql://avoid_user:${DB_PASSWORD:-avoid_pass_change_me}@db:5432/avoid_error
      SECRET_KEY: ${SECRET_KEY:-please_change_this_in_production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      ENABLE_OLLAMA: "false"
      # 容器部署：监听所有网卡、端口 8000（由 start.py 读取）
      HOST: "0.0.0.0"
      PORT: "8000"
      LOG_LEVEL: "INFO"
      # 云端大模型（OpenAI 兼容，如通义千问 DashScope）：AI_PROVIDER=cloud 时走云端
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-qwen-plus}
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  pgdata:
